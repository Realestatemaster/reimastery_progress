<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REI Mastery — Student Roadmap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0d1b2a;
    --navy-mid: #162236;
    --navy-card: #1c2e45;
    --navy-hover: #233650;
    --gold: #c9a84c;
    --gold-light: #e2c06e;
    --gold-dim: rgba(201,168,76,0.15);
    --white: #f0f4f8;
    --muted: #7a90a8;
    --success: #3ecf8e;
    --radius: 10px;
  }

  body {
    background-color: var(--navy);
    background-image:
      linear-gradient(to bottom, rgba(13,27,42,0.5) 0%, rgba(13,27,42,0.75) 50%, rgba(13,27,42,0.95) 100%),
      url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1800&auto=format&fit=crop&q=80');
    background-size: cover;
    background-position: center bottom;
    background-attachment: fixed;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--navy-mid);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--white);
    line-height: 1.2;
  }

  .logo-text span { color: var(--gold); }

  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    max-width: 400px;
    margin: 0 32px;
  }

  .progress-bar-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-label {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .progress-label span { color: var(--gold); font-weight: 600; }

  /* EMAIL GATE */
  #gate {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 65px);
    padding: 40px 20px;
  }

  .gate-box {
    background: var(--navy-mid);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }

  .gate-trophy { font-size: 48px; margin-bottom: 16px; }

  .gate-box h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .gate-box p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .gate-input {
    width: 100%;
    background: var(--navy-card);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 12px;
  }

  .gate-input:focus { border-color: var(--gold); }
  .gate-input::placeholder { color: var(--muted); }

  .gate-btn {
    width: 100%;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.5px;
  }

  .gate-btn:hover { background: var(--gold-light); }
  .gate-btn:active { transform: scale(0.98); }

  .gate-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
  }

  /* BOARD */
  #board { display: none; }

  .board-wrap {
    padding: 28px 24px;
    overflow-x: auto;
  }

  .board {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    min-width: max-content;
  }

  /* COLUMN */
  .column {
    width: 300px;
    background: rgba(22,34,54,0.88);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    flex-shrink: 0;
    backdrop-filter: blur(4px);
  }

  .col-header {
    padding: 16px 18px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .col-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--gold);
  }

  .col-count {
    background: var(--gold-dim);
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
  }

  .col-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

  /* CARD */
  .card {
    background: var(--navy-card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .card:hover { border-color: rgba(201,168,76,0.3); }

  .card.completed { border-color: rgba(62,207,142,0.3); }
  .card.completed .card-title { color: var(--muted); text-decoration: line-through; }

  .card-top {
    padding: 14px 14px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }

  .card-checkbox {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 2px solid var(--muted);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .card.completed .card-checkbox {
    background: var(--success);
    border-color: var(--success);
  }

  .card-checkbox svg { display: none; }
  .card.completed .card-checkbox svg { display: block; }

  .card-info { flex: 1; }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--white);
    transition: color 0.2s;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }

  .checklist-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 2px 7px;
    border-radius: 99px;
  }

  .checklist-pill.done { color: var(--success); background: rgba(62,207,142,0.1); }

  .open-btn {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    padding: 3px 8px;
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .open-btn:hover { background: rgba(201,168,76,0.15); color: var(--gold); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px 40px;
    overflow-y: auto;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--navy-mid);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    padding: 36px;
    position: relative;
    animation: slideUp 0.18s ease;
    margin: auto;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    line-height: 1;
  }
  .modal-close:hover { background: rgba(255,255,255,0.15); color: var(--white); }

  .modal-col-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 8px;
  }

  .modal-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.3;
    margin-bottom: 24px;
    padding-right: 24px;
  }
  .modal-title.done-title { color: var(--muted); text-decoration: line-through; }

  .modal-complete-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 9px 16px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 28px;
  }
  .modal-complete-btn:hover { border-color: var(--success); color: var(--success); }
  .modal-complete-btn.is-done { background: rgba(62,207,142,0.1); border-color: var(--success); color: var(--success); }

  .modal-check-icon {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 2px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .modal-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 0 0 24px; }

  .modal-section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .modal-desc {
    font-size: 14px;
    color: var(--white);
    line-height: 1.65;
    margin-bottom: 16px;
  }

  .modal-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    color: var(--gold);
    text-decoration: none;
    padding: 9px 16px;
    background: var(--gold-dim);
    border-radius: 8px;
    font-weight: 500;
    transition: all 0.2s;
    margin-bottom: 24px;
  }
  .modal-link:hover { background: rgba(201,168,76,0.25); }

  .modal-progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .modal-progress-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .modal-progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 99px;
    transition: width 0.3s ease;
  }
  .modal-progress-pct { font-size: 12px; color: var(--muted); min-width: 32px; text-align: right; }

  .modal-ci {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-ci:hover { background: rgba(255,255,255,0.04); }

  .modal-ci input[type="checkbox"] {
    appearance: none;
    width: 17px;
    height: 17px;
    border: 2px solid var(--muted);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
  }
  .modal-ci input[type="checkbox"]:checked { background: var(--success); border-color: var(--success); }
  .modal-ci input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 0;
    width: 5px; height: 9px;
    border: 2px solid white;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .modal-ci label {
    font-size: 14px;
    color: var(--white);
    line-height: 1.45;
    cursor: pointer;
    transition: color 0.2s;
  }
  .modal-ci input:checked + label { color: var(--muted); text-decoration: line-through; }

  /* USER BAR */
  .user-bar {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-email {
    font-size: 13px;
    color: var(--muted);
  }

  .logout-btn {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 99px; }
</style>
</head>

</div>

<!-- MODAL -->

  <div class="modal" id="modal">

</div>

// ─── STATE ─────────────────────────────────────────────────────────────────────
let userEmail = '';
let progress = {};

async function saveProgress() {
  const email = userEmail.toLowerCase().trim();
  try {
    // Try PATCH first (update existing row)
    const patchRes = await fetch(
      `${SUPABASE_URL}/rest/v1/progress?email=eq.${encodeURIComponent(email)}`,
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          progress_data: progress,
          updated_at: new Date().toISOString()
        })
      }
    );

    if (patchRes.ok) {
      // Check if any row was actually updated
      const count = patchRes.headers.get('content-range');
      const updated = count && count !== '*/0';
      
      if (!updated) {
        // No row existed — INSERT instead
        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/progress`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            email: email,
            progress_data: progress,
            updated_at: new Date().toISOString()
          })
        });
        if (!insertRes.ok) {
          const err = await insertRes.text();
          console.error('Supabase insert error:', err);
        }
      }
    } else {
      const err = await patchRes.text();
      console.error('Supabase patch error:', err);
    }
  } catch(e) {
    console.error('Supabase save failed:', e);
  }
  // Always save locally as backup
  localStorage.setItem(`reimastery_progress_${email}`, JSON.stringify(progress));
}

async function loadProgress() {
  const email = userEmail.toLowerCase().trim();
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/progress?email=eq.${encodeURIComponent(email)}&select=progress_data`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    if (res.ok) {
      const data = await res.json();
      if (data && data.length > 0 && data[0].progress_data) {
        progress = data[0].progress_data;
        // Sync to local storage too
        localStorage.setItem(`reimastery_progress_${email}`, JSON.stringify(progress));
        return;
      }
    }
  } catch(e) {
    console.error('Supabase load failed:', e);
  }
  // Fallback to local storage
  const raw = localStorage.getItem(`reimastery_progress_${email}`);
  progress = raw ? JSON.parse(raw) : {};
}

async function loadBoard() {
  const input = document.getElementById('emailInput').value.trim();
  if (!input || !input.includes('@')) {
    document.getElementById('emailInput').style.borderColor = '#e74c3c';
    return;
  }
  userEmail = input;
  localStorage.setItem('reimastery_email', userEmail);
  document.getElementById('userEmailDisplay').textContent = userEmail;

  // Show loading state
  const btn = document.getElementById('gateBtn');
  btn.textContent = 'Loading...';
  btn.disabled = true;

  await loadProgress();
  renderBoard();
  document.getElementById('gate').style.display = 'none';
  document.getElementById('board').style.display = 'block';
  updateGlobalProgress();

  btn.textContent = 'Open My Roadmap';
  btn.disabled = false;
}

});

// ─── RENDER ────────────────────────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('boardInner');
  board.innerHTML = '';
  BOARD.forEach(col => {
    board.appendChild(renderColumn(col));
  });
}

function renderColumn(col) {
  const el = document.createElement('div');
  el.className = 'column';
  el.innerHTML = `
    <div class="col-header">
      <div class="col-title">${col.title}</div>
      <div class="col-count">${col.cards.length}</div>
    </div>
    <div class="col-body" id="colbody_${col.id}"></div>
  `;
  const body = el.querySelector(`#colbody_${col.id}`);
  col.cards.forEach(card => body.appendChild(renderCard(card)));
  return el;
}

function renderCard(card) {
  const el = document.createElement('div');
  const hasChecklist = card.checklist && card.checklist.length > 0;
  const isCardDone = progress[card.id] === true;

  el.className = 'card' + (isCardDone ? ' completed' : '');
  el.id = `card_${card.id}`;

  let pillHtml = '';
  if (hasChecklist) {
    const doneCount = card.checklist.filter(i => progress[i.id]).length;
    const total = card.checklist.length;
    const allDone = doneCount === total;
    pillHtml = `<div class="checklist-pill ${allDone ? 'done' : ''}">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="2" stroke="currentColor"/>${allDone ? '<path d="M2.5 5L4.5 7L7.5 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' : ''}</svg>
      ${doneCount}/${total}
    </div>`;
  }

  el.innerHTML = `
    <div class="card-top" onclick="openModal('${card.id}')">
      <div class="card-checkbox" onclick="event.stopPropagation(); markCardDone('${card.id}')">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="card-info">
        <div class="card-title">${card.title}</div>
        <div class="card-meta">${pillHtml}</div>
      </div>
    </div>
  `;

  return el;
}

// ─── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(cardId) {
  const card = findCard(cardId);
  if (!card) return;

  const col = BOARD.find(c => c.cards.some(card => card.id === cardId));
  const isCardDone = progress[card.id] === true;
  const hasChecklist = card.checklist && card.checklist.length > 0;

  let doneCount = 0, total = 0, pct = 0;
  if (hasChecklist) {
    doneCount = card.checklist.filter(i => progress[i.id]).length;
    total = card.checklist.length;
    pct = Math.round((doneCount / total) * 100);
  }

  const descHtml = card.description
    ? `<div class="modal-section-label">Description</div>
       <p class="modal-desc">${card.description.replace(/\n\n/g, '<br><br>')}</p>`
    : '';

  const isSkool = card.link && card.link.includes('skool.com');
  const isDoc = card.link && card.link.includes('docs.google.com');
  const linkLabel = isDoc ? 'Open Script' : 'Watch in Skool';
  const linkIcon = isDoc
    ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2h6l3 3v7H2V2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 2v3h3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polygon points="5,3 12,7 5,11" fill="currentColor"/></svg>`;

  const linkHtml = card.link
    ? `<a class="modal-link" href="${card.link}" target="_blank">${linkIcon} ${linkLabel}</a>`
    : '';

  const checklistHtml = hasChecklist ? `
    <hr class="modal-divider">
    <div class="modal-section-label">Checklist</div>
    <div class="modal-progress-row">
      <div class="modal-progress-track">
        <div class="modal-progress-fill" id="mpf_${card.id}" style="width:${pct}%"></div>
      </div>
      <div class="modal-progress-pct" id="mpct_${card.id}">${pct}%</div>
    </div>
    ${card.checklist.map(item => `
      <div class="modal-ci">
        <input type="checkbox" id="mci_${item.id}" ${progress[item.id] ? 'checked' : ''}
          onchange="modalToggleItem('${card.id}', '${item.id}', this.checked)" />
        <label for="mci_${item.id}">${item.text}</label>
      </div>
    `).join('')}
  ` : '';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-col-label">${col ? col.title : ''}</div>
    <div class="modal-title ${isCardDone ? 'done-title' : ''}" id="modal-title-${card.id}">${card.title}</div>
    <button class="modal-complete-btn ${isCardDone ? 'is-done' : ''}" id="modal-done-btn-${card.id}" onclick="modalToggleCard('${card.id}')">
      <div class="modal-check-icon">
        ${isCardDone ? '<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
      </div>
      ${isCardDone ? 'Completed' : 'Mark complete'}
    </button>
    ${descHtml}
    ${linkHtml}
    ${checklistHtml}
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function modalToggleCard(cardId) {
  progress[cardId] = !progress[cardId];
  // If uncompleting, uncheck all checklist items too
  const card = findCard(cardId);
  saveProgress();
  // Update modal button
  const btn = document.getElementById(`modal-done-btn-${cardId}`);
  const title = document.getElementById(`modal-title-${cardId}`);
  const isDone = progress[cardId];
  if (btn) {
    btn.className = 'modal-complete-btn' + (isDone ? ' is-done' : '');
    btn.innerHTML = `<div class="modal-check-icon">${isDone ? '<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>${isDone ? 'Completed' : 'Mark complete'}`;
  }
  if (title) title.className = 'modal-title' + (isDone ? ' done-title' : '');
  // Re-render card on board
  const old = document.getElementById(`card_${cardId}`);
  if (old && card) old.replaceWith(renderCard(card));
  updateGlobalProgress();
}

function modalToggleItem(cardId, itemId, checked) {
  progress[itemId] = checked;
  const card = findCard(cardId);
  if (card && card.checklist) {
    const allDone = card.checklist.every(i => progress[i.id]);
    progress[cardId] = allDone;
    // Update modal done button
    const btn = document.getElementById(`modal-done-btn-${cardId}`);
    const title = document.getElementById(`modal-title-${cardId}`);
    if (btn) {
      btn.className = 'modal-complete-btn' + (allDone ? ' is-done' : '');
      btn.innerHTML = `<div class="modal-check-icon">${allDone ? '<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>${allDone ? 'Completed' : 'Mark complete'}`;
    }
    if (title) title.className = 'modal-title' + (allDone ? ' done-title' : '');
    // Update progress bar in modal
    const doneCount = card.checklist.filter(i => progress[i.id]).length;
    const pct = Math.round((doneCount / card.checklist.length) * 100);
    const fill = document.getElementById(`mpf_${cardId}`);
    const pctEl = document.getElementById(`mpct_${cardId}`);
    if (fill) fill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';
  }
  saveProgress();
  // Re-render card on board
  const old = document.getElementById(`card_${cardId}`);
  if (old && card) old.replaceWith(renderCard(card));
  updateGlobalProgress();
}

function markCardDone(cardId) {
  progress[cardId] = !progress[cardId];
  saveProgress();
  const card = findCard(cardId);
  if (card) {
    const old = document.getElementById(`card_${cardId}`);
    old.replaceWith(renderCard(card));
  }
  updateGlobalProgress();
}

function findCard(cardId) {
  for (const col of BOARD) {
    for (const card of col.cards) {
      if (card.id === cardId) return card;
    }
  }
  return null;
}

function updateGlobalProgress() {
  let total = 0;
  let done = 0;
  BOARD.forEach(col => {
    col.cards.forEach(card => {
      total++;
      if (progress[card.id]) done++;
    });
  });
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalLabel').innerHTML = `<span>${done}</span> / ${total} done`;
}
